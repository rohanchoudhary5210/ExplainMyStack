<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ExplainMyStack</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header>
    <h1>ExplainMyStack</h1>
    <p class="hint">Understand GitHub files and ask questions about a public repository.</p>
  </header>
  <section>
    <h2>Single-file explanation</h2>
    <button id="explain">Explain This File</button>
  </section>
  <section>
    <h2>Repository questions</h2>
    <label for="question">What would you like to understand?</label>
    <textarea id="question" rows="3" maxlength="1000" placeholder="Where is authentication implemented?"></textarea>
    <button id="ask-repository">Ask About Repository</button>
    <p class="hint">Analyzes up to 8 selected source files, not the entire repository.</p>
  </section>
  <details>
    <summary>Local backend settings</summary>
    <label for="api-token">API token (only if configured on backend)</label>
    <input id="api-token" type="password" autocomplete="off" placeholder="Optional token" />
    <p class="hint">Token stays in this panel session and is not saved.</p>
  </details>
  <p id="file" class="hint"></p>
  <div id="status" role="status" aria-live="polite"></div>
  <main id="result"></main>
  <p id="sources" class="hint"></p>
  <script src="markdown.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
